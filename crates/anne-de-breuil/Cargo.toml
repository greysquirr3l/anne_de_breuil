[package]
name = "anne-de-breuil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "anne_de_breuil"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
figment.workspace = true
humantime-serde.workspace = true
home.workspace = true
tokio.workspace = true
async-trait.workspace = true
blake3.workspace = true
reqwest.workspace = true
ipnet.workspace = true
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
netstat2 = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }
wmi = { workspace = true, optional = true }

# `windows` itself compiles as a plain library on any host, but the current
# `windows`/`windows-future` release pair has a real upstream bug that only
# reproduces off Windows (`windows_core::imp::IMarshal`/`marshaler` are
# `#[cfg(windows)]`-gated inside `windows-core`, but `windows-future` — an
# unconditional dependency of `windows`, not behind any of its own Cargo
# features — calls them unconditionally). Restricting this dependency to
# the `cfg(windows)` target, the same way `sysinfo` itself already
# target-restricts its own `windows` dependency, sidesteps the bug entirely
# on this macOS/Linux dev and CI hosts: Cargo never resolves the edge at
# all off Windows, so `windows-future` never gets built.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[features]
default = ["windows-collector", "linux-collector", "report-html"]
windows-collector = ["dep:netstat2", "dep:sysinfo", "dep:wmi", "dep:windows"]
linux-collector = []
ssh = []
report-html = ["dep:sha2", "dep:base64"]
store-sqlite = ["dep:rusqlite"]
portal = []
