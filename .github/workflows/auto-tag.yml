name: auto-tag

# Tags `main` with `v<workspace version>` whenever that version hasn't
# already been tagged. Exists purely to give `release.yml` something to
# react to: a tag created here with the default GITHUB_TOKEN does *not*
# trigger another workflow's `on: push: tags` (GitHub suppresses events
# from the built-in token to prevent recursive workflow triggering) --
# `release.yml` instead listens for this workflow's completion via
# `on: workflow_run` and reads the tag back out of the artifact this
# workflow uploads. See `release.yml`'s `resolve-tag` job.
on:
  push:
    branches: [main]

# Least-privilege default: read-only for the whole workflow, with the one
# write scope this job genuinely needs (pushing the tag) declared on the
# job itself. A top-level `contents: write` would hand every step in
# every job of this file write access to the repository -- including the
# `actions/checkout` step, which does not need it. Scope it to the job
# that pushes the tag and nowhere else.
permissions:
  contents: read

jobs:
  tag:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag if the workspace version hasn't been tagged yet
        id: tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already exists, nothing to release"
            echo "tag=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Hand the resolved tag to `release.yml`. A `workflow_run` event
      # carries no access to the triggering workflow's job outputs, so an
      # artifact is the only channel between the two workflows;
      # `release.yml` reads it back with `actions/download-artifact` and
      # `run-id: ${{ github.event.workflow_run.id }}`. The literal `none`
      # (rather than an empty file) is the "no new tag was created"
      # signal, so the file is never empty and the reader never has to
      # distinguish "no tag" from "no artifact".
      - name: Publish the resolved tag for the release workflow
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/release-tag.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag
          path: ${{ runner.temp }}/release-tag.txt
          retention-days: 1
