[workspace]
resolver = "3"
members = ["crates/anne-de-breuil", "crates/anne-de-breuil-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Listening-port surface enumeration correlated with process, service, and firewall policy."
repository = "https://github.com/anne-de-breuil/anne-de-breuil"
readme = "README.md"
keywords = ["network", "security", "port-scanner", "firewall", "audit"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
anne-de-breuil = { path = "crates/anne-de-breuil", version = "0.1.0" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process", "fs"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ipnet = "2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
proptest = "1"
figment = { version = "0.10.19", features = ["toml", "env"] }
toml = "0.8.23"
humantime-serde = "1.1.1"
home = "0.5.12"
sha2 = "0.11.0"
base64 = "0.23.1"
blake3 = "1.8.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
netstat2 = "0.11.2"
sysinfo = "0.39.6"
wmi = "0.18.4"
netlink-sys = { version = "0.8", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Services",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
