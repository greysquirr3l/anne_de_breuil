# Service fingerprint catalogue — DATA, not code.
#
# Compiled into the binary via `include_str!` and parsed once by
# `domain::fingerprint`. Adding a new fingerprint means adding a
# `[[fingerprint]]` table below; it never requires a Rust code change.
#
# `category` and `confidence` are spelled exactly as the real
# `domain::ServiceCategory` / `domain::Confidence` enum variant names
# (PascalCase) so they deserialize directly, with no translation layer.
#
# `[fingerprint.matchers]` fields are independent, corroborating signals —
# ANY one present matcher that finds a hit is sufficient for the entry to
# match. None are mandatory; an entry lists only the matchers that make
# sense for the protocol it fingerprints:
#   http_header          = { name = "...", pattern = "..." }  — header name
#                           (case-insensitive) + regex against its value
#   body_prefix           = "..."   — literal text; matches if any line of
#                                     an HTTP body evidence entry starts
#                                     with it (not a regex, so unbounded by
#                                     construction)
#   body_pattern           = "..."  — regex searched against an HTTP body
#                                     evidence entry
#   tls_subject_pattern    = "..."  — regex searched against a TLS
#                                     certificate subject evidence entry
#   banner_pattern         = "..."  — regex searched against a banner
#                                     evidence entry
#   alpn                   = [...]  — exact (case-insensitive) match against
#                                     a negotiated ALPN protocol
#   version_capture        = "..."  — regex with one capture group, applied
#                                     only to the evidence that already
#                                     matched this entry; the first capture
#                                     found becomes the reported version
#
# Every regex is compiled once behind a `LazyLock` and rejected at load if
# it fails the complexity check (see `domain::fingerprint` for what that
# check actually is and, honestly, is not).

[[fingerprint]]
name = "node_exporter"
category = "Monitoring"
confidence = "Confirmed"
[fingerprint.matchers]
http_header = { name = "content-type", pattern = '^text/plain; version=0\.0\.4' }
body_prefix = "node_"
version_capture = 'node_exporter_build_info\{[^}]*version="([0-9.]+)"'

[[fingerprint]]
name = "windows_exporter"
category = "Monitoring"
confidence = "Confirmed"
[fingerprint.matchers]
http_header = { name = "content-type", pattern = '^text/plain; version=0\.0\.4' }
body_prefix = "windows_"
version_capture = 'windows_exporter_build_info\{[^}]*version="([0-9.]+)"'

[[fingerprint]]
name = "mssql_exporter"
category = "Monitoring"
