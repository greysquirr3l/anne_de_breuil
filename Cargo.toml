[workspace]
resolver = "3"
members = ["crates/anne-de-breuil", "crates/anne-de-breuil-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Listening-port surface enumeration correlated with process, service, and firewall policy."
repository = "https://github.com/anne-de-breuil/anne-de-breuil"
readme = "README.md"
keywords = ["network", "security", "port-scanner", "firewall", "audit"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
anne-de-breuil = { path = "crates/anne-de-breuil", version = "0.1.0" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process", "fs"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ipnet = "2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
proptest = "1"
figment = { version = "0.10.19", features = ["toml", "env"] }
toml = "0.8.23"
humantime-serde = "1.1.1"
home = "0.5.12"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
assert_cmd = "2"
predicates = "3"
sha2 = "0.11.0"
base64 = "0.23.1"
blake3 = "1.8.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
netstat2 = "0.11.2"
sysinfo = "0.39.6"
wmi = "0.18.4"
netlink-sys = { version = "0.8", default-features = false }
# `default-features = false` + `ring` (not the default `aws-lc-rs`) keeps the
# crypto backend pure Rust, matching the choice already made for `rustls`
# above -- `aws-lc-rs` builds BoringSSL-derived C/assembly via cc/cmake,
# which works against static cross-compilation the same way OpenSSL would.
#
# The default `rsa` feature is deliberately left off: the `rsa` crate has an
# open, unfixed advisory (RUSTSEC-2023-0071, the Marvin Attack timing
# side-channel) with no available upgrade. Ed25519/ECDSA cover every key
# type this project's own fixtures and recommended setup use; dropping RSA
# support keeps `cargo audit` clean by removing the vulnerable dependency
# rather than suppressing the finding.
russh = { version = "0.62.7", default-features = false, features = [
  "ring",
  "flate2",
] }
russh-sftp = "2.4.0"
# HMAC-SHA1 is the wire format OpenSSH itself uses for hashed known_hosts
# entries (`|1|salt|hash`) -- unrelated to the SSH transport's own crypto
# backend above, so pulling it in doesn't reopen the pure-Rust question.
sha1 = "0.10"
hmac = "0.12"
# Per-OS native credential store backend, not the freedesktop Secret
# Service -- see the doc comment on `authenticate_via_keyring` in
# `adapters/ssh_transport/handler.rs` for why. Each platform enables its own
# backend feature in the crate manifest's target-specific dependency table;
# this entry only pins the version.
keyring = { version = "3", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_System_Services",
] }
indicatif = "0.18"
console = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
