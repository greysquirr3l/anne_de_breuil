[package]
name = "anne-de-breuil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "anne"
path = "src/main.rs"

[dependencies]
# `ssh` and `store-sqlite` are additive on top of anne-de-breuil's own
# defaults (windows-collector, linux-collector, report-html) -- without
# them, the real `anne` binary never compiled `SshTransport`/
# `SqliteSnapshotStore` in at all, so `--inventory`/`--target` fan-out and
# a `[store] backend = "Sqlite"` config both silently had nothing behind
# them outside a `--all-features` test/CI build. See
# `docs/integration-wiring-audit.md` (T31) for the full finding.
anne-de-breuil = { workspace = true, features = ["ssh", "store-sqlite"] }
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
time = { workspace = true }

[build-dependencies]
# `set_build_env_var` re-runs the build script whenever HEAD moves, so the
# embedded SHA in `anne --version` stays current without `cargo clean`.
# No transitive dev-dependencies beyond the workspace `time` crate (already
# pulled by the library); nothing else is required for `Command::new("git").
time = { workspace = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
