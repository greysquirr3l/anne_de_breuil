name: release

# Triggered by `auto-tag.yml` finishing, not by the tag push itself: a tag
# pushed with the default GITHUB_TOKEN (as `auto-tag.yml` does) never fires
# another workflow's `on: push: tags` -- GitHub suppresses that specifically
# to stop one workflow's automated push from recursively triggering others.
# `resolve-tag` re-derives the tag from the commit `auto-tag.yml` ran
# against instead of trusting anything about *why* it ran.
on:
  workflow_run:
    workflows: [auto-tag]
    types: [completed]

# Every job inherits read-only by default; only `publish-release` (the one
# step that actually creates a GitHub release and uploads assets) opts
# into `contents: write`, matching the least-privilege posture T28 already
# established for ci.yml.
permissions:
  contents: read

jobs:
  resolve-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - id: tag
        run: echo "tag=$(git describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-msvc:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-xwin
        run: cargo install cargo-xwin

      # Needed before the cross-build steps below, not just before
      # "Verify no dynamic CRT import": cc-rs invokes `llvm-lib` (from this
      # same apt package) to archive the C sources `ring` compiles for the
      # MSVC target via clang-cl, and fails with "failed to find tool
      # 'llvm-lib'" if this hasn't run yet. Verified against a real
      # ubuntu-latest run -- moving this later, after the cross-builds,
      # broke both `cargo xwin build` steps.
      - name: Install llvm tools (llvm-lib, llvm-objdump)
        run: sudo apt-get update && sudo apt-get install -y llvm

      # xwin cross-builds the MSVC target on an ubuntu-latest runner --
      # faster and deterministic compared to a native windows-latest build,
      # and it's link-only (import libs, not execution), so a real
      # windows-latest job still has to run the result (see
      # `smoke-test-windows`) before this is trusted.
      #
      # aarch64-pc-windows-msvc is deliberately not built here: cargo-xwin
      # 0.23.1 emits `/imsvc <path>` (MSVC-style) in
      # CFLAGS_aarch64_pc_windows_msvc, but the C compiler actually invoked
      # for `ring`'s C sources on this target is bare `clang`, which
      # doesn't understand that flag form and fails with "no such file or
      # directory: '/imsvc'" -- a real cargo-xwin bug, not anything in this
      # repo, reproduced identically on both a local macOS machine and a
      # real ubuntu-latest runner. x86_64-pc-windows-msvc runs fine under
      # Windows 11 ARM64's built-in x64 emulation, so this is a real gap
      # (no native ARM64 binary) rather than a full platform drop; revisit
      # once cargo-xwin fixes this upstream.
      - name: Cross-build x86_64-pc-windows-msvc
        run: cargo xwin build --release --target x86_64-pc-windows-msvc -p anne-de-breuil-cli

      # `.cargo/config.toml` sets target-feature=+crt-static for this
      # target so the collector starts on a bare host with neither Rust
      # nor the VC++ Redistributable installed. This is the automated
      # check for that -- a dynamic VCRUNTIME/MSVCP import here means the
      # rustflag silently didn't apply.
      - name: Verify no dynamic CRT import
        run: cargo run -p xtask -- verify-static target/x86_64-pc-windows-msvc/release/anne.exe

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/anne.exe dist/anne-x86_64-pc-windows-msvc.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-raw
          path: dist/

  # No real code-signing certificate exists for this repository (and won't
  # in a fork/dry-run context) -- this step is a genuine, correctly
  # structured Authenticode signing path that reads the cert from secrets
  # and signs for real when they're present, and skips cleanly with a
  # clear log message when they're not, rather than failing the release or
  # silently pretending to sign. `osslsigncode` cross-signs from Linux, so
  # this stays on ubuntu-latest instead of needing a Windows runner.
  sign-windows:
    needs: build-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-msvc-raw
          path: dist

      - name: Authenticode-sign (skips if no cert is configured)
        env:
          WINDOWS_CODESIGN_CERT: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CODESIGN_CERT:-}" ]; then
            echo "::notice::WINDOWS_CODESIGN_CERT is not set -- shipping unsigned Windows binaries. \
          An unsigned collector will be flagged by EDR on a real target host; configure \
          WINDOWS_CODESIGN_CERT/WINDOWS_CODESIGN_PASSWORD as repository secrets to sign for real."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y osslsigncode
          echo "$WINDOWS_CODESIGN_CERT" | base64 -d > codesign.pfx
          for exe in dist/*.exe; do
            osslsigncode sign \
              -pkcs12 codesign.pfx -pass "$WINDOWS_CODESIGN_PASSWORD" \
              -n "anne-de-breuil" \
              -i "https://github.com/${GITHUB_REPOSITORY}" \
              -t http://timestamp.digicert.com \
              -in "$exe" -out "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          rm -f codesign.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-binaries
          path: dist/

  # The closest CI gets to "a Windows machine with no Rust installed":
  # xwin's cross-build only proves the exe *links*, not that it runs --
  # this actually executes it on a real windows-latest runner.
  smoke-test-windows:
    needs: sign-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-msvc-binaries
          path: dist

      - name: --version
        run: dist\anne-x86_64-pc-windows-msvc.exe --version

      # `inventory validate` only parses a local TOML file -- no network,
      # no target host, no SSH -- so it exercises a real subcommand
      # without this dry-run job depending on network reachability.
      - name: no-network subcommand
        run: dist\anne-x86_64-pc-windows-msvc.exe inventory validate crates\anne-de-breuil-cli\fixtures\inventory\valid.toml

  build-musl:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # `ring`/`blake3`/`libsqlite3-sys` (rusqlite's bundled sqlite3.c)
      # compile a handful of C sources as part of the build. Bare `clang`
      # (previously used here) cross-compiles for musl using the *host*
      # runner's glibc headers -- there's no musl sysroot on PATH by
      # default -- so sqlite3.c's large-file symbols (open64, fstat64,
      # pread64, ...) compile as real references that simply don't exist
      # in musl's static libc, a real link failure caught on real CI, not
      # local dev (ring/blake3 alone never hit this, since neither uses
      # those symbols). Real musl-gcc cross toolchains (originally
      # prebuilt by musl.cc, the same toolchains most of the Rust-on-musl
      # ecosystem uses to cross-build from an x86_64 Linux host) ship
      # musl's actual headers, so only the C *compiler* needs to change
      # here -- `rust-lld` stays the Rust *linker*, unchanged from
      # before, since it links fine once the C objects reference real
      # musl symbols. Verified in a real ubuntu:latest container against
      # both targets before landing this.
      #
      # Fetched from this repo's own `musl-cross-mirror` release, not
      # musl.cc directly: musl.cc blocks GitHub Actions' IP ranges
      # wholesale (its own homepage states this outright, dated
      # 2025-05-27), confirmed by two consecutive real CI failures here
      # before the block was found. SHA-256-verified against the digest
      # recorded when that release was created, so a compromised or
      # corrupted mirror asset fails loudly instead of silently.
      - name: Install musl cross toolchains
        run: |
          set -euo pipefail
          declare -A checksums=(
            [x86_64-linux-musl]=c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea
            [aarch64-linux-musl]=c909817856d6ceda86aa510894fa3527eac7989f0ef6e87b5721c58737a06c38
          )
          for triple in x86_64-linux-musl aarch64-linux-musl; do
            archive="/tmp/${triple}-cross.tgz"
            curl -fsSL -o "$archive" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/musl-cross-mirror/${triple}-cross.tgz"
            echo "${checksums[$triple]}  $archive" | sha256sum -c -
            sudo tar -xzf "$archive" -C /opt
            echo "/opt/${triple}-cross/bin" >> "$GITHUB_PATH"
          done

      - name: Resolve rust-lld path
        run: |
          host_triple=$(rustc -vV | sed -n 's/^host: //p')
          echo "RUST_LLD=$(rustc --print sysroot)/lib/rustlib/${host_triple}/bin/rust-lld" >> "$GITHUB_ENV"

      - name: Build x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          RUSTFLAGS: "-C linker=${{ env.RUST_LLD }} -C linker-flavor=ld.lld"
        run: cargo build --release --target x86_64-unknown-linux-musl -p anne-de-breuil-cli

      - name: Build aarch64-unknown-linux-musl
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          RUSTFLAGS: "-C linker=${{ env.RUST_LLD }} -C linker-flavor=ld.lld"
        run: cargo build --release --target aarch64-unknown-linux-musl -p anne-de-breuil-cli

      # `ldd` reports "not a dynamic executable" for a real static binary
      # without needing to execute it (it inspects the ELF program headers
      # for PT_INTERP first) -- true for the aarch64 exe too, even though
      # this runner can't execute aarch64 code. `readelf -d` is the
      # fallback if ldd's wording ever drifts: no NEEDED entries in the
      # dynamic section is the same underlying fact ldd is reporting.
      - name: Verify static linking
        run: |
          set -euo pipefail
          for exe in target/x86_64-unknown-linux-musl/release/anne target/aarch64-unknown-linux-musl/release/anne; do
            file "$exe"
            ldd_out=$(ldd "$exe" 2>&1 || true)
            echo "$ldd_out"
            if echo "$ldd_out" | grep -qiE "not a dynamic executable|statically linked"; then
              echo "$exe: confirmed static via ldd"
            elif ! readelf -d "$exe" 2>/dev/null | grep -q NEEDED; then
              echo "$exe: no NEEDED entries in dynamic section (readelf)"
            else
              echo "$exe: could not confirm static linking" >&2
              exit 1
            fi
          done

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/anne dist/anne-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/anne dist/anne-aarch64-unknown-linux-musl

      - uses: actions/upload-artifact@v4
        with:
          name: musl-binaries
          path: dist/

  sbom-and-checksums:
    needs: [resolve-tag, sign-windows, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-binaries"
          merge-multiple: true

      # Runs against the final artifact bytes (post-signing for the
      # Windows exes) -- an SBOM or checksum computed before signing would
      # describe bytes nobody actually receives. Installed via syft's own
      # documented install script rather than a wrapper action, since the
      # exact CLI invocation below is what was verified locally against a
      # real build in T29 (`syft dir:. -o cyclonedx-json=...`).
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX SBOM
        run: |
          syft dir:. \
            --source-name anne-de-breuil \
            --source-version "${{ needs.resolve-tag.outputs.tag }}" \
            -o cyclonedx-json=dist/anne-de-breuil.cdx.json

      - name: Write checksums
        run: cargo run -p xtask -- checksum write dist/SHA256SUMS.txt dist/anne-*

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            dist/anne-de-breuil.cdx.json
            dist/SHA256SUMS.txt

  publish-release:
    needs: [resolve-tag, smoke-test-windows, sbom-and-checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-binaries"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: dist/*
