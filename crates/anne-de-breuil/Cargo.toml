# `windows` itself compiles as a plain library on any host, but the current
# `windows`/`windows-future` release pair has a real upstream bug that only
# reproduces off Windows (`windows_core::imp::IMarshal`/`marshaler` are
# `#[cfg(windows)]`-gated inside `windows-core`, but `windows-future` — an
# unconditional dependency of `windows`, not behind any of its own Cargo
# features — calls them unconditionally). Restricting this dependency to
# the `cfg(windows)` target, the same way `sysinfo` itself already
# target-restricts its own `windows` dependency, sidesteps the bug entirely
# on this macOS/Linux dev and CI hosts: Cargo never resolves the edge at
# all off Windows, so `windows-future` never gets built.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }
keyring = { workspace = true, features = ["windows-native"], optional = true }

# `netlink-sys` genuinely doesn't compile off Linux (it binds
# `libc::sockaddr_nl`, which doesn't exist in macOS's libc) -- unlike the
# `windows`-crate situation above, this isn't a workaround for an upstream
# bug, it's a real platform boundary, so it's target-restricted the same
# way `sysinfo` and `netstat2` already restrict their own Linux-only
# netlink dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = { workspace = true, optional = true }
keyring = { workspace = true, features = ["linux-native"], optional = true }

# Native macOS Keychain backend for `AuthMethod::KeyFromKeyring` -- see the
# doc comment on `authenticate_via_keyring` in
# `adapters/ssh_transport/handler.rs` for why this is the native backend
# rather than the freedesktop Secret Service.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"], optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# SARIF schema validation, `domain::report_render` tests only. The vendored
# schema (`fixtures/sarif-schema-2.1.0.json`) has no external `$ref`s, so
# `default-features = false` drops the `reqwest`/`tls-aws-lc-rs` resolver
# stack entirely -- validation stays fully offline, matching this project's
# existing pure-Rust-crypto-backend choices for `rustls`/`russh`.
rcgen = "0.14"
jsonschema = { version = "0.50.0", default-features = false }

[features]
default = ["windows-collector", "linux-collector", "report-html"]
windows-collector = ["dep:netstat2", "dep:sysinfo", "dep:wmi", "dep:windows"]
linux-collector = ["dep:netstat2", "dep:sysinfo", "dep:netlink-sys"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:sha1", "dep:hmac", "dep:keyring"]
report-html = ["dep:base64", "dep:askama"]
store-sqlite = ["dep:rusqlite"]
portal = []
